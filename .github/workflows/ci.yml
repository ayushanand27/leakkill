name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read  # least privilege by default
jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with: { go-version: "1.25" }
      - name: actionlint (exact version; Go verifies every module against sum.golang.org)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "${{ matrix.python }}" }
      - name: Install locked tooling (exact versions, SHA-256 verified, wheels only)
        run: |
          pip install --require-hashes --only-binary :all: -r requirements/ci.txt
          pip install --no-deps --no-build-isolation -e .
      - name: Tests with coverage (fails under 88%)
        run: |
          coverage run -m pytest -q
          coverage report
      - name: Scan this repo for secrets (dogfooding)
        run: leakkill scan --exclude-tests .
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - name: Build with locked tooling
        run: |
          pip install --require-hashes --only-binary :all: -r requirements/ci.txt
          python -m build --no-isolation && twine check dist/*
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Action fails on a leaky folder
        id: leaky
        uses: ./
        continue-on-error: true
        with: { path: tests/fixtures/leaky }
      - name: Action passes on clean code
        id: clean
        uses: ./
        with: { path: src }
      - name: Check outcomes
        shell: bash
        run: |
          test "${{ steps.leaky.outcome }}" = failure
          test "${{ steps.leaky.outputs.found }}" = 1
          test "${{ steps.clean.outputs.found }}" = 0
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['version']=='2.1.0' and d['runs'][0]['results']" "${{ steps.leaky.outputs.sarif-file }}"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['runs'][0]['results'] == []" "${{ steps.clean.outputs.sarif-file }}"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - name: Build the image
        run: docker build -t leakkill:ci .
      - name: Smoke test (version, leaky folder fails, clean code passes, git history works)
        run: |
          docker run --rm leakkill:ci --version
          if docker run --rm -v "$PWD/tests/fixtures/leaky:/scan" leakkill:ci; then exit 1; fi
          docker run --rm -v "$PWD/src:/scan" leakkill:ci
          repo=$(mktemp -d) && cd "$repo" && git init -q && git config user.email ci@example.com && git config user.name ci
          echo "t = \"ghp_$(printf 'a1B2c3D4e5%.0s' 1 2 3)abcdef\"" > a.py && git add a.py && git commit -qm leak
          git rm -q a.py && git commit -qm "remove it"
          if docker run --rm -v "$repo:/scan" leakkill:ci --history; then exit 1; fi
