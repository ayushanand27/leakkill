name: Publish to PyPI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # "Run workflow" button: releases the version in src/leakkill/__init__.py
permissions:
  contents: read  # jobs below raise only what they need
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - name: Read version (a pushed tag must match it)
        id: version
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'src'); import leakkill; print(leakkill.__version__)")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != version $v"; exit 1
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: Install locked tooling (exact versions, SHA-256 verified, wheels only)
        run: |
          pip install --require-hashes --only-binary :all: -r requirements/ci.txt
          pip install --no-deps --no-build-isolation -e .
      - run: pytest -q
      - run: python -m build --no-isolation && twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: { name: dist, path: dist/ }
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: pypi, url: "https://pypi.org/p/leakkill" }
    permissions: { id-token: write }  # trusted publishing: no API token stored anywhere
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2, pinned: this step can publish to PyPI
  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with: { name: dist, path: dist/ }
      - run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "leakkill $TAG" --notes-file CHANGELOG.md
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ needs.build.outputs.tag }}" }
      - name: "Move the major tag (e.g. v0) so `uses: ayushanand27/leakkill@v0` gets this release"
        env: { TAG: "${{ needs.build.outputs.tag }}" }
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
