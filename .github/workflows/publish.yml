name: Publish to PyPI
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tag must match package version
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'src'); import leakkill; print(leakkill.__version__)")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: pip install -e . pytest && pytest -q
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: pypi, url: "https://pypi.org/p/leakkill" }
    permissions: { id-token: write }  # trusted publishing: no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "leakkill $GITHUB_REF_NAME" --notes-file CHANGELOG.md
        env: { GH_TOKEN: "${{ github.token }}" }
