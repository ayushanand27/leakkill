# Generated detection-rule data (tools/import_gitleaks.py). It contains the public example keys that
# Gitleaks allowlists as known fakes, which secret detectors would otherwise report.
# benchmarks/: a developer script run by hand on a downloaded dataset, not shipped in the package.
sonar.exclusions=src/leakkill/gitleaks_rules.py,benchmarks/**
sonar.sources=src,tools,action.yml,.github
sonar.tests=tests
sonar.python.version=3.9,3.10,3.11,3.12,3.13
sonar.sourceEncoding=UTF-8
