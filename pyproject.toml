[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secretscan"
version = "0.2.0"
description = "Catch leaked secrets in code, git history, and AI coding agents before they escape"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

[project.scripts]
secretscan = "secretscan:main_cli"

[tool.setuptools]
py-modules = ["secretscan"]
