[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "leakkill"
dynamic = ["version"]
description = "Find leaked secrets, check if they're live, revoke them in one command, and keep them out of AI coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.9"
authors = [{ name = "Ayush", email = "andymylove24@gmail.com" }]
keywords = ["secrets", "security", "leak", "revoke", "pre-commit", "claude-code", "ai-agents", "devsecops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/ayushanand27/leakkill"
Issues = "https://github.com/ayushanand27/leakkill/issues"
Changelog = "https://github.com/ayushanand27/leakkill/blob/main/CHANGELOG.md"

[project.scripts]
leakkill = "leakkill.cli:main_cli"

[tool.setuptools.dynamic]
version = { attr = "leakkill.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
